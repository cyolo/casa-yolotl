name: Casa Yolotl CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-and-test:
    name: Validate monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint workspaces
        run: npm run lint --workspaces --if-present

      - name: Test workspaces
        run: npm run test --workspaces --if-present

      - name: Build workspaces
        run: npm run build --workspaces --if-present
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          APP_ENV: ci
          NEXTAUTH_SECRET: ci-nextauth-secret
          ALLOWED_ADMIN_EMAILS: ci@example.com
          AUTHORIZED_ADMIN_EMAIL: ci@example.com
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          DATA_SOURCE: static
          GCP_PROJECT_ID: ci-gcp-project

      - name: Docker build storefront
        run: |
          docker build \
            --build-arg APP_NAME=storefront \
            --build-arg NEXTAUTH_SECRET=ci-nextauth-secret \
            --build-arg ALLOWED_ADMIN_EMAILS=ci@example.com \
            --build-arg AUTHORIZED_ADMIN_EMAIL=ci@example.com \
            --build-arg GOOGLE_CLIENT_ID=ci-google-client-id \
            --build-arg GOOGLE_CLIENT_SECRET=ci-google-client-secret \
            --build-arg DATA_SOURCE=static \
            --build-arg GCP_PROJECT_ID=ci-gcp-project \
            --build-arg APP_ENV=ci \
            -t casa-yolotl-storefront-ci .

      - name: Docker build admin
        run: |
          docker build \
            --build-arg APP_NAME=admin \
            --build-arg NEXTAUTH_SECRET=ci-nextauth-secret \
            --build-arg ALLOWED_ADMIN_EMAILS=ci@example.com \
            --build-arg AUTHORIZED_ADMIN_EMAIL=ci@example.com \
            --build-arg GOOGLE_CLIENT_ID=ci-google-client-id \
            --build-arg GOOGLE_CLIENT_SECRET=ci-google-client-secret \
            --build-arg DATA_SOURCE=static \
            --build-arg GCP_PROJECT_ID=ci-gcp-project \
            --build-arg APP_ENV=ci \
            -t casa-yolotl-admin-ci .
